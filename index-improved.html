<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketBOSS</title>
<!-- External CSS -->
<link rel="stylesheet" href="styles.css">
<!-- External JS -->
<script defer src="scripts.js"></script>
</head>
<body>
<!-- Shell Wrapper -->
<div class="shell">

  <!-- Header -->
  <header class="hdr" role="banner">
    <div class="logo">
      <h1>MarketBOSS</h1>
      <p>Your Inventory Partner</p>
    </div>
    <nav id="header-nav">
      <button id="menu-toggle">☰</button>
    </nav>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tabs" aria-label="Primary Navigation">
    <button class="tab tab-home" aria-pressed="true">Home</button>
    <button class="tab tab-inventory">Inventory</button>
    <button class="tab tab-transactions">Transactions</button>
    <button class="tab tab-analytics">Analytics</button>
  </nav>

  <!-- Content Area -->
  <main class="content">
    <section id="home-screen" class="screen visible">
      <h2>Home</h2>
      <p>Welcome to MarketBOSS!</p>
    </section>
    <section id="inventory-screen" class="screen">
      <h2>Inventory</h2>
    </section>
    <section id="transactions-screen" class="screen">
      <h2>Transactions</h2>
    </section>
    <section id="analytics-screen" class="screen">
      <h2>Analytics</h2>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MarketBOSS</p>
  </footer>
</div>

</body>
</html>
